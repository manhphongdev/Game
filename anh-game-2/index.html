<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghép Hình 2 — Câu Đố Xanh</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="app">
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-spinner"></div>
      <p class="loading-text">Đang tải câu đố 2...</p>
    </div>

    <div class="game-wrapper hidden" id="gameWrapper">
      <header class="header">
        <div class="header__brand">
          <span class="header__icon" aria-hidden="true">🧩</span>
          <div>
            <h1 class="header__title">Ghép Hình 2</h1>
            <p class="header__subtitle">Kéo các mảnh lên lớp nền cố định và căn chỉnh bằng mắt</p>
          </div>
        </div>
        <div class="timer" id="timer" aria-live="polite">
          <span class="timer__label">Thời gian</span>
          <span class="timer__value" id="timerValue">00:00</span>
        </div>
      </header>

      <main class="play-arena" id="playSurface">
        <div class="drag-layer" id="dragLayer" aria-hidden="true"></div>

        <aside class="side-tray side-tray--left" id="trayLeft" aria-label="Mảnh ghép bên trái"></aside>

        <section class="board-section" aria-label="Khu vực ghép hình">
          <div class="puzzle-board" id="puzzleBoard">
            <!-- Lớp nền cố định — không kéo được -->
            <img
              class="board-base"
              id="boardBase"
              src="cau1/caudo1_0003_Layer-1.png"
              alt="Lớp nền cố định"
              draggable="false"
            >
          </div>
        </section>

        <aside class="side-tray side-tray--right" id="trayRight" aria-label="Mảnh ghép bên phải"></aside>
      </main>

      <footer class="controls">
        <a class="btn btn--secondary" href="../index.html">← Câu 1</a>
        <button class="btn btn--primary" id="btnRestart" type="button">
          <span aria-hidden="true">↺</span> Chơi lại
        </button>
      </footer>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
