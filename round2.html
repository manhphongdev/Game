<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round 2 - Giải Mã Câu Nói Của Bác Hồ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
  <div class="flag-star-bg" aria-hidden="true"></div>
  <div class="animated-bg" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  <main class="round2-shell">
    <section class="round2-board" aria-label="Khu vực sắp xếp câu nói">
      <div class="section-heading">
        <p class="eyebrow">Mật thư</p>
      </div>
      <div class="letter-answer" id="letterAnswer"></div>
      <div class="round2-actions">
        <a class="btn btn--secondary" href="/">Về dashboard</a>
        <button class="btn btn--secondary" id="resetRound2" type="button">Làm lại</button>
        <button class="btn btn--secondary" id="showAnswer" type="button">Hiển thị đáp án</button>
        <button class="btn btn--primary" id="checkAnswer" type="button">Kiểm tra đáp án</button>
        <button class="btn btn--secondary" id="undoToken" type="button">Xóa ký tự cuối</button>
      </div>
      <p class="round2-message" id="round2Message" role="status" aria-live="polite"></p>
    </section>

    <section class="round2-board" aria-label="Khu mở mã">
      <div class="section-heading">
        <p class="eyebrow">Mã Round 1</p>
      </div>
      <div class="code-controls" id="codeControls"></div>
      <div class="revealed-codes" id="revealedCodes" aria-label="Mã đã mở"></div>
      <div class="section-heading section-heading--compact">
        <p class="eyebrow">Ký tự khả dụng</p>
      </div>
      <div class="letter-bank" id="letterBank"></div>
    </section>
  </main>

  <script src="data/games.js"></script>
  <script src="round2.js"></script>
</body>
</html>
